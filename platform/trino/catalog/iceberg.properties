# E3 — Catálogo Iceberg do Trino (aponta para o REST catalog + MinIO).
# Em produção AWS: iceberg.catalog.type=glue + S3 nativo — só este arquivo muda.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-catalog:8181
iceberg.rest-catalog.warehouse=s3://lake/
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
